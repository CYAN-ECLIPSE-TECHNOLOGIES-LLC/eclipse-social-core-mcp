[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eclipse-social-core"
version = "0.1.0"
description = "Eclipse Social Core MCP — the shared core of the Eclipse social adapter family: one canonical, hash-bound content package, per-adapter variants with classified diffs, hash-bound owner approvals, a capability-mode registry, and the engagement policy module. Governance only: no platform action, no network calls."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cyan Eclipse Technologies LLC" },
]
keywords = ["mcp", "model-context-protocol", "social-media", "governance", "approvals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://cetech.ai"
Repository = "https://github.com/CYAN-ECLIPSE-TECHNOLOGIES-LLC/eclipse-social-core-mcp"
Vendor = "https://cetech.ai"

[project.scripts]
eclipse-social-core = "server:main"

# Version lockstep: this version, the VERSION file, server.json, and the
# server.py docstring all read 0.1.0 — bump them together.
# Flat layout: the runtime is the top-level server.py module. Runtime
# data read beside server.py (Path(__file__).parent / ...) is
# force-included at the same relative path in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
"fixtures/sample_content.json" = "fixtures/sample_content.json"

[tool.hatch.build.targets.sdist.force-include]
"server.py" = "server.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
"fixtures/sample_content.json" = "fixtures/sample_content.json"
